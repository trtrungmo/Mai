        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            document.getElementById('total-q').innerText = quizData.length;

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';

                const title = document.createElement('div');
                title.className = 'question-title';
                title.innerText = `Câu ${index + 1}: ${item.question}`;
                card.appendChild(title);

                const optionsList = document.createElement('ul');
                optionsList.className = 'options-list';

                const shuffledOptions = shuffleArray([...item.options]);

                shuffledOptions.forEach(optionText => {
                    const li = document.createElement('li');
                    li.className = 'option-item';
                    li.innerText = optionText;

                    li.onclick = function() {
                        checkAnswer(this, optionText, item.answer, optionsList);
                    };

                    optionsList.appendChild(li);
                });

                card.appendChild(optionsList);
                container.appendChild(card);
            });
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkAnswer(selectedLi, selectedText, correctText, ulElement) {
            const allOptions = ulElement.querySelectorAll('li');
            allOptions.forEach(li => {
                li.classList.add('disabled'); 
                if (li.innerText === correctText) {
                    li.classList.add('correct');
                } else {
                    li.classList.add('unselected-disabled');
                }
            });

            if (selectedText !== correctText) {
                selectedLi.classList.remove('unselected-disabled');
                selectedLi.classList.add('incorrect');
            }
        }

        window.onload = initQuiz;
    </script>
