const T=[

["Bài 2 · Map-Reduce",[

["Combine trong đếm từ giúp gì?",["Đổi kết quả cuối","Gộp cục bộ tại Map để giảm dữ liệu truyền qua mạng","Thay Reduce","Tăng số Reduce"],1,"5 cặp → 4 cặp (80 → 64 byte); kết quả không đổi vì phép cộng kết hợp, giao hoán."],
["Tính trung bình cộng bằng Map-Reduce, giá trị trung gian là gì?",["Trung bình từng phần","Cặp (tổng, số lượng)","Chỉ số lượng","Giá trị lớn nhất"],1,"[2,4] và [9]: trung bình của trung bình = 6 sai (đúng là 5). Giữ (S,C), chia S/C cuối."],

["Máy Map đã xong nhưng hỏng trước khi Reduce lấy dữ liệu. Hệ thống làm gì?",["Bỏ qua","Chạy lại tác vụ Map (đầu ra trung gian ở đĩa cục bộ đã mất)","Chạy lại toàn bộ công việc","Chạy lại mọi Reduce"],1,"Đầu vào còn bản sao HDFS; đầu ra Map mất nên tạo lại. Reduce đã công bố thì giữ."]]],
["Bài 3 · PageRank",[

["Dừng với Δ = ‖rᵗ⁺¹−rᵗ‖₁, cận sai số so với r* là?",["Δ","βΔ/(1−β) (β=4/5: 4Δ)","β²Δ","Δ/β"],1,"Phép lặp co hệ số β: βΔ + β²Δ + … = βΔ/(1−β)."],
["Cụm thao tác liên kết, β = 0,85: đóng góp từ ngoài x được khuếch đại khoảng?",["1 lần","1,5 lần","≈ 3,6 lần","≈ 10 lần"],2,"y ≈ x/(1−β²) + (β/(1+β))·m/n: hệ số 400/111 ≈ 3,6 và ≈ 0,46."],
["Spam Mass sᵢ = (rᵢ − ρᵢ)/rᵢ, ρ là TrustRank. Cách đọc?",["Gần 1: có lẽ là rác; âm/nhỏ: có lẽ không phải","Gần 1: trang tin cậy","Âm: chắc chắn rác","Chỉ cần PageRank"],0,"Trên G4: s_A = 1/5, s_B = s_D = −23/95. TrustRank dịch chuyển vào tập tin cậy T."],
["HITS, h⁰ = (1,1,1,1,1) trên G5: uy tín chuẩn hóa a¹?",["(1,1,1,1,1)","(½,1,1,1,½)","(½,½,1,1,1)","(2,1,1,1,2)"],1,"ã = Lᵀh = (1,2,2,2,1), chia cho max (2). HITS không chia bậc ra."]]],
["Bài 5 · Shingling & MinHash",[
["Tập 2-shingle của D = abcdabd?",["{ab,bc,cd,da,ab,bd}","{ab,bc,cd,da,bd}","{abc,bcd,cda,dab,abd}","{a,b,c,d}"],1,"“ab” lặp nên tập có 5 phần tử (tối đa ℓ−k+1 cửa sổ)."],
["Với hoán vị π chọn đều, Pr[h_π(S) = h_π(T)] = ?",["1/|U|","SIM(S,T) (Jaccard)","1 − SIM(S,T)","|S ∩ T|"],1,"Phần tử đầu của S∪T phân bố đều; trùng khi thuộc S∩T: x/(x+y)."],
["Ước lượng Jaccard từ chữ ký n hàng có độ lệch chuẩn √(s(1−s)/n). Giảm một nửa sai số cần?",["n gấp đôi","n gấp bốn","n gấp tám","n giảm một nửa"],1,"Độ lệch chuẩn tỉ lệ 1/√n nên n phải gấp 4."],
["S₁={a,d}, S₄={a,c,d}; π₁=(e,a,b,c,d), π₂=(d,a,c,e,b). Kết quả?",["Cùng chữ ký (a,d): tỷ lệ trùng 1, Jaccard thật 2/3","Khác chữ ký; Jaccard 0","Cùng (e,d); Jaccard 1","Cùng (a,d); Jaccard 1"],0,"Chỉ 2 hàng nên ước lượng thô; n lớn thì hội tụ về Jaccard."],
["Hàm băm hàng (a·r + b) mod R là hoán vị khi nào?",["a chẵn","gcd(a, R) = 1","b = 0","Luôn luôn"],1,"Ví dụ f₂(r) = (3r+1) mod 5 có gcd(3,5) = 1."]]],
["Bài 6 · LSH",[
["Phân dải b dải × r hàng: xác suất cặp có Jaccard s thành ứng viên?",["s^(b·r)","1 − (1 − sʳ)ᵇ","(1 − s)^(b·r)","b·sʳ"],1,"AND trong dải (sʳ), OR giữa các dải."],
["b = 20, r = 5, s = 0,8. Xác suất thành ứng viên?",["0,328","0,67","≈ 0,9996","0,5"],2,"s⁵ = 0,32768; (0,67232)²⁰ ≈ 0,000356; P ≈ 0,99964."],
["Vùng chuyển tiếp của đường cong chữ S xấp xỉ?",["(1/b)^(1/r)","b/r","r^b","1/(b·r)"],0,"b=20, r=5: (1/20)^(1/5) ≈ 0,549."],
["Siêu phẳng ngẫu nhiên, hai vector có góc θ: Pr[cùng dấu] = ?",["θ/π","1 − θ/π","θ/(2π)","cos θ"],1,"Pr[khác dấu] = θ/π; 2/3 bit khác dấu → θ = 120°."],
["x=(2,7), y=(6,4). Khoảng cách L₁, L₂, L∞?",["7, 5, 4","5, 7, 4","4, 5, 7","7, 25, 4"],0,"Độ lệch 4 và 3: L₁=7, L₂=5, L∞=4."]]],
["Bài 7 · Chỉ mục hàng xóm gần đúng",[
["K = 5, chỉ mục tìm lại 3 trong 5 hàng xóm thật. Đại lượng nào?",["precision = 5/3","recall@5 = 3/5","độ trễ 3 ms","recall@5 = 5/3"],1,"recall@K = |N_K ∩ N̂_K| / K."],
["Trong HNSW, bề rộng chùm ở các tầng trên và tầng 0?",["Tầng trên ef=1; tầng 0 dùng efSearch","Mọi tầng efSearch","Tầng trên ef=K; tầng 0 ef=1","Chỉ tìm ở tầng 0"],0,"Tầng trên thưa, cạnh dài; Pr[tầng ≥ k] = ρᵏ, ρ = e^(−1/m_L)."],
["N=10¹⁰, D=3072: thành phần chiếm ≈ 98% bộ nhớ HNSW?",["Danh sách cạnh","Véc-tơ gốc (≈ 122,88 TB)","Bảng tra","Bộ mã PQ"],1,"Cạnh chỉ ≈ 2,65 TB; nên cần nén véc-tơ bằng lượng tử hóa."],
["PQ (m đoạn, k*=256) so với VQ cùng mã 64 bit, D=128?",["Bộ mã PQ nhỏ hơn 256 lần (32 768 số)","PQ không cần k-means","PQ chính xác tuyệt đối","PQ không cần bộ mã"],0,"VQ cần 2⁶⁴·128 số; PQ (m=8) chỉ 256·128 mà vẫn có 2⁶⁴ mã."],
["Quét PQ đầy đủ và IVF khác nhau thế nào?",["PQ giảm chi phí mỗi phép đo; IVF giảm số véc-tơ được chấm (chỉ mở nprobe danh sách)","Cả hai giảm số véc-tơ","PQ giảm số véc-tơ; IVF giảm chi phí phép đo","Cả hai chỉ giảm bộ nhớ"],0,"IVF-PQ (kc=10⁵, nprobe=64) ≈ 3,63·10⁹ thao tác, ít hơn quét PQ đủ."]]]];
const E=[
["Bài 1 · Phân tích thuật toán tìm cặp tài liệu gần trùng","Đặc tả bài toán, trình bày thuật toán xét mọi cặp, chứng minh tính đúng và đánh giá chi phí khi N = 10⁶.","<b>Đặc tả:</b> vào N tập hữu hạn khác rỗng C₁..C_N, τ∈[0,1]; ra R = {(i,j): 1≤i&lt;j≤N, J(Cᵢ,Cⱼ)≥τ}, mỗi cặp một lần; N&lt;2 thì rỗng.<br><b>Thuật toán:</b> for i=1..N−1, for j=i+1..N: tính J chính xác, nếu ≥τ thì xuất (i,j). Bắt đầu j từ 1 sẽ trả cặp đảo/tự so sánh → sai đặc tả.<br><b>Tính đúng:</b> bất biến — sau mỗi bước, kết quả đã xuất gồm đúng các cặp đạt ngưỡng trong phần đã xét; xét hết thì bằng R.<br><b>Chi phí:</b> N(N−1)/2 = 499 999 500 000 cặp (N=10⁶), mỗi cặp O(L) → O(N²L). Còn xét bộ nhớ, đọc ghi, mạng, độ trễ.<br><b>Kết luận:</b> đúng nhưng quá đắt → dùng MinHash + LSH chọn ứng viên rồi xác minh bằng Jaccard (có nguy cơ bỏ sót)."],
["Bài 2 · Thiết kế Map-Reduce đếm từ","Với d₁=“mèo chó mèo”, d₂=“chó chim”: viết Map, Combine, Reduce, chạy tay, nêu lợi ích Combine, mô hình thời gian và cách xử lý khi máy hỏng.","<b>Map(dᵢ):</b> mỗi lần từ w xuất hiện phát (w,1). <b>Reduce(w,L):</b> c=Σv, phát (w,c). <b>Combine:</b> cộng cục bộ cùng khóa.<br><b>Chạy tay:</b> Map d₁ → (mèo,1),(chó,1),(mèo,1); d₂ → (chó,1),(chim,1): 5 cặp. Combine: (mèo,2),(chó,1) + d₂ → 4 cặp (80→64 byte, 16 byte/cặp). Nhóm: mèo[2], chó[1,1], chim[1] → (mèo,2),(chó,2),(chim,1); tổng 5 lần.<br><b>Combine</b> giảm dữ liệu qua mạng, kết quả không đổi (cộng kết hợp, giao hoán).<br><b>Thời gian:</b> T_P = điều phối + Map + truyền/nhóm + Reduce (mỗi pha tới máy chậm nhất); S_P = T₁/T_P (24/10 = 2,4).<br><b>Chịu lỗi:</b> Map hỏng → chạy lại Map; Reduce hỏng → làm lại Reduce chưa xong; đầu vào/kết quả có bản sao HDFS."],
["Bài 3 · PageRank trên G4 (β = 4/5)","G4: A→B,C,D; B→A,D; C→A; D→B,C. Tính một vòng từ r⁰ đều, nêu điểm cố định và vai trò của bước nhảy, nút cụt.","d_A=3, d_B=2, d_C=1, d_D=2; M₀ cột là nguồn, phần tử 1/d_nguồn.<br>r'ᵢ = βΣ r_j/d_j + (1−β)/n + βδ/n; G4 không nút cụt (δ=0), (1−β)/n = 1/20.<br><b>Vòng 1:</b> A=(4/5)(1/8+1/4)+1/20 = 7/20; B=C=D=(4/5)(5/24)+1/20 = 13/60; tổng = 1.<br><b>Điểm cố định:</b> A=9/28≈0,321; B=C=D=19/84≈0,226.<br>Bước nhảy giúp thoát bẫy (C→C dồn hết điểm về C); bù δ giữ tổng bằng 1 (bỏ C→A: tổng thô còn 3/4).<br><b>Hội tụ:</b> ‖F(x)−F(y)‖₁ ≤ β‖x−y‖₁ → điểm cố định duy nhất; dừng khi Δ=Σ|r'ᵢ−rᵢ| ≤ τ."],
["Bài 4 · PageRank theo chủ đề (G4, S = {B, D})","Tính các vòng đầu, điều kiện dừng, cận sai số, điểm cố định và nhận xét.","G4 không nút cụt. v=(0,½,0,½)ᵀ, r⁰=v, rᵗ⁺¹=βM₀rᵗ+(1−β)v (B, D nhận thêm 1/10 mỗi vòng).<br><b>r¹</b>=(1/5,3/10,1/5,3/10); <b>r²</b>=(7/25,41/150,13/75,41/150); <b>r³</b>=(31/125,71/250,23/125,71/250); tổng luôn = 1.<br><b>Dừng:</b> Δ₂=4/25=0,16; Δ₃=0,064 (giảm → hội tụ); dừng khi Δ≤τ hoặc hết K vòng.<br><b>Cận sai số:</b> ‖rᵗ⁺¹−r*‖₁ ≤ βΔ/(1−β) = 4Δ (sau vòng 2: 0,64; sai số thực ≈ 0,046).<br><b>Điểm cố định:</b> giải r=βM₀r+(1−β)v → r*=(9/35, 59/210, 19/105, 59/210) ≈ (0,257; 0,281; 0,181; 0,281).<br><b>Nhận xét:</b> B=D&gt;A&gt;C; A, C ngoài S vẫn dương nhờ liên kết từ B, D. PageRank thường: A=9/28 cao nhất, nay A tụt xuống hạng 3."],
["Bài 5 · Shingling và MinHash","Cho S₁={a,d}, S₂={c}, S₃={b,d,e}, S₄={a,c,d}; π₁=(e,a,b,c,d), π₂=(d,a,c,e,b). Tính chữ ký, ước lượng Jaccard, so với thật; nêu ý nghĩa shingling.","<b>Shingling:</b> D=abcdabd, k=2 → {ab,bc,cd,da,bd}; k đủ lớn (email k=5, tài liệu dài k=9); số shingle ≤ ℓ−k+1.<br><b>MinHash:</b> h_π(S) = phần tử đứng đầu theo π; Pr[h(S)=h(T)] = SIM(S,T).<br>π₁: S₁→a, S₂→c, S₃→e, S₄→a. π₂: S₁→d, S₂→c, S₃→d, S₄→d.<br><b>Chữ ký:</b> σ(S₁)=σ(S₄)=(a,d); σ(S₂)=(c,c); σ(S₃)=(e,d).<br><b>Ước lượng</b> = tỷ lệ hàng trùng: (S₁,S₄)=1 (thật 2/3); (S₂,S₄)=0 (thật 1/3) — lệch vì n=2. E[ước lượng]=s, độ lệch chuẩn √(s(1−s)/n).<br>Thực tế dùng hàm băm f(r) thay hoán vị, quét hàng một lần: SIG(i,c)=min fᵢ(r) trên các hàng có 1; bộ nhớ Θ(nC); n=250 → 1000 byte thay vì 200 000 byte."],
["Bài 6 · LSH phân dải","Chữ ký n=100, b=20 dải, r=5 hàng. Khi nào cặp là ứng viên? Tính xác suất với s=0,8 và s=0,5, ngưỡng xấp xỉ và vai trò xác minh.","Chia n=b·r; mỗi cột ở mỗi dải là một tuple r giá trị; băm khóa (j, tuple) vào thùng; chung thùng ở ít nhất một dải → ứng viên (AND trong dải, OR giữa các dải).<br><b>P(s) = 1 − (1 − sʳ)ᵇ.</b><br>s=0,8: s⁵=0,32768; (0,67232)²⁰≈0,000356 → P≈0,99964. s=0,5: s⁵=0,03125 → P≈0,47.<br>Đường cong chữ S; ngưỡng ≈ (1/b)^(1/r) = (1/20)^(1/5) ≈ 0,549. Tăng r → khắt khe hơn; tăng b → thêm lượt thử.<br>Sau đó xác minh ứng viên bằng Jaccard gốc để loại ứng viên giả; cặp thật không thành ứng viên thì bị bỏ sót.<br>Mở rộng: họ MinHash là (d₁,d₂,1−d₁,1−d₂)-nhạy cảm; siêu phẳng: Pr[cùng dấu] = 1−θ/π."],
["Bài 7 · Chỉ mục hàng xóm gần đúng","Tìm K hàng xóm gần nhất trong N=10¹⁰ véc-tơ, D=3072. Nêu vấn đề của quét đầy đủ, trình bày HNSW, PQ, IVF-PQ và cách đánh giá chỉ mục.","<b>Quét đủ:</b> lưu 10¹⁰·3072·4 byte = 122,88 TB; mỗi truy vấn ≈ 3,07·10¹³ lượt tọa độ → cần tìm gần đúng, đo bằng recall@K = |N_K ∩ N̂_K|/K cùng độ trễ, thời gian xây, bộ nhớ.<br><b>HNSW:</b> đồ thị nhiều tầng, tầng 0 chứa mọi điểm, tầng trên thưa (Pr[tầng≥k]=ρᵏ); ef=1 ở tầng trên, efSearch ở tầng 0; ≈O(log N) phép đo (giả thiết Delaunay); véc-tơ gốc vẫn chiếm ≈98% bộ nhớ.<br><b>PQ:</b> chia x thành m đoạn, mỗi đoạn VQ k*=2ᵇ tâm, mã (i₁..i_m); cùng mã 64 bit, bộ mã PQ nhỏ hơn VQ 256 lần. Ví dụ D=4, m=2: x=(0,2;1,8|2,7;0,1) → mã (0,1), sai số 0,18. ADC: lập bảng tra, chấm mã bằng m lần tra (512 thay vì 3072).<br><b>IVF-PQ:</b> kc danh sách, chỉ mở nprobe gần q (mã phần dư): kc=10⁵, nprobe=64 → ≈3,63·10⁹ thao tác.<br>PQ giảm chi phí mỗi phép đo; IVF/đồ thị giảm số véc-tơ được đo; đánh đổi bằng recall."]];

const t=T[cur],done=Object.keys(S[cur].a).length;b.innerHTML='<span>'+t[0]+' · Đúng '+sc(cur)+'/'+t[1].length+' ('+done+' đã làm)</span><button>Làm lại</button>';b.querySelector('button').onclick=()=>{S[cur]={a:{},o:t[1].map(q=>sh(q[1].map((_,i)=>i)))};draw()};
t[1].forEach((q,qi)=>{const c=document.createElement('div'),a=S[cur].a[qi];c.className='q';const h=document.createElement('h3');h.textContent=(qi+1)+'. '+q[0];c.append(h);
S[cur].o[qi].forEach((oi,k)=>{const o=document.createElement('button');o.className='o';o.textContent='ABCD'[k]+'. '+q[1][oi];if(a!==undefined){o.disabled=true;if(oi==q[2])o.classList.add('ok');else if(oi==a)o.classList.add('no')}else o.onclick=()=>{S[cur].a[qi]=oi;draw()};c.append(o)});
if(a!==undefined){const x=document.createElement('div');x.className='ex';x.textContent=(a==q[2]?'Đúng. ':'Sai. ')+q[3];c.append(x)}v.append(c)})}
