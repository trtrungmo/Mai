<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân hàng câu hỏi Bài 10 - Tương tác</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        /* Bộ lọc */
        .filters {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: white;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .btn-reset {
            background-color: #e11d48;
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-reset:hover {
            background-color: #be123c;
        }

        /* Thẻ câu hỏi */
        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            border: 1px solid var(--border-color);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-tl {
            background: #fef3c7;
            color: #92400e;
        }

        .question-content {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        /* Danh sách đáp án Trắc nghiệm */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-btn {
            text-align: left;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
        }

        .option-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #166534;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }

        /* Phần trả lời ngắn */
        .short-answer-section {
            margin-bottom: 15px;
        }

        .btn-toggle-answer {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-toggle-answer:hover {
            background: var(--primary-hover);
        }

        /* Khung giải thích */
        .explanation-box {
            background: #f0fdf4;
            border-left: 4px solid var(--success-color);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-title {
            font-weight: 600;
            color: #15803d;
            margin-bottom: 4px;
        }

        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Ngân hàng Câu hỏi Bài 10 (90 Câu)</h1>
        <p>Hệ thống ôn tập trắc nghiệm và trả lời ngắn có tương tác và giải thích chi tiết.</p>
    </header>

    <!-- Bộ lọc -->
    <div class="filters">
        <div class="filter-group">
            <label for="filter-dot"><strong>Đợt:</strong></label>
            <select id="filter-dot" onchange="filterQuestions()">
                <option value="all">Tất cả các đợt</option>
                <option value="1">Đợt 1</option>
                <option value="2">Đợt 2</option>
                <option value="3">Đợt 3</option>
                <option value="4">Đợt 4</option>
                <option value="5">Đợt 5</option>
                <option value="6">Đợt 6</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-type"><strong>Loại câu hỏi:</strong></label>
            <select id="filter-type" onchange="filterQuestions()">
                <option value="all">Tất cả</option>
                <option value="TN">Trắc nghiệm</option>
                <option value="TL">Trả lời ngắn</option>
            </select>
        </div>

        <button class="btn-reset" onclick="resetAnswers()">Làm lại từ đầu</button>
    </div>

    <!-- Danh sách câu hỏi -->
    <div id="questions-container">
        <!-- Các câu hỏi sẽ được render tự động bằng Javascript -->
    </div>
</div>

<script>
    // Dữ liệu 90 câu hỏi tích hợp sẵn từ nguồn B10_CHI_DE.md và B10_DAP_AN.md
    const questionsData = [
        // --- ĐỢT 1 ---
        {
            id: "B10-TN-001", dot: 1, type: "TN",
            question: "Cột `price_num` là số, không thiếu. KPI giá chỉ dùng giá dương; phải giữ nguyên dữ liệu gốc.\n\nQuy tắc nào đáp ứng đúng yêu cầu? Mỗi phương án ghi **tên — điều kiện — lý do — hành động**.",
            options: [
                "A. `gia_loi` — `price_num <= 0` — KPI cần giá dương — xóa dòng khỏi bảng gốc.",
                "B. `gia_loi` — `price_num < 0` — KPI cần giá dương — gắn cờ, loại khỏi KPI giá.",
                "C. `gia_loi` — `price_num <= 0` — KPI cần giá dương — gắn cờ, loại khỏi KPI giá.",
                "D. `gia_loi` — `price_num >= 0` — KPI cần giá dương — gắn cờ, loại khỏi KPI giá."
            ],
            correct: 2, // Đáp án C (index 2)
            explanation: "Giá âm và giá 0 bị gắn cờ, loại khỏi KPI theo quy ước; bảng gốc vẫn được giữ nguyên."
        },
        {
            id: "B10-TN-002", dot: 1, type: "TN",
            question: "Giá tính bằng nghìn đồng/đêm:\n\nDòng 0: Private, NaN\nDòng 1: Private, 100\nDòng 2: Private, NaN\nDòng 3: Private, 200\nDòng 4: Entire, 300\nDòng 5: Entire, 400\n\n**Trong nhóm Private**, tỷ lệ dòng thiếu giá là bao nhiêu?",
            options: [
                "A. 100%",
                "B. 50%",
                "C. Khoảng 33,33%",
                "D. Khoảng 66,67%"
            ],
            correct: 1, // Đáp án B
            explanation: "Có 2 dòng thiếu trên tổng số 4 dòng thuộc nhóm Private: 2/4 × 100 = 50%."
        },
        {
            id: "B10-TN-003", dot: 1, type: "TN",
            question: "```python\nd = pd.DataFrame({\n    \"accommodates\": [2, 2, 2, 4, 4, 4],\n    \"bedrooms\": [1., np.nan, 3., 2., np.nan, 4.]\n})\nd[\"bedrooms_isna\"] = d[\"bedrooms\"].isna()\nd[\"bedrooms\"] = d[\"bedrooms\"].fillna(\n    d.groupby(\"accommodates\")[\"bedrooms\"].transform(\"median\")\n)\n```\nBộ ba `(d.loc[1,\"bedrooms\"], d.loc[4,\"bedrooms\"], int(d[\"bedrooms_isna\"].sum()))` bằng gì?",
            options: [
                "A. `(2.5, 2.5, 2)`",
                "B. `(2.0, 3.0, 0)`",
                "C. `(1.0, 1.0, 2)`",
                "D. `(2.0, 3.0, 2)`"
            ],
            correct: 3, // Đáp án D
            explanation: "Trung vị nhóm sức chứa 2 là 2; nhóm sức chứa 4 là 3. Cờ được tạo trước khi điền nên vẫn ghi nhận 2 giá trị thiếu ban đầu."
        },
        {
            id: "B10-TN-004", dot: 1, type: "TN",
            question: "Một tập tham chiếu có Q1 = 100, Q3 = 200, đơn vị nghìn đồng/đêm. Dùng ngưỡng trên `Q3 + 1.5 × IQR` của tập này để sàng lọc năm giá mới:\n`100, 200, 350, 351, 500`\nChỉ gắn cờ giá **lớn hơn** ngưỡng. Cặp **(ngưỡng trên, số giá bị cờ)** là gì?",
            options: [
                "A. `(350, 2)`",
                "B. `(200, 3)`",
                "C. `(350, 3)`",
                "D. `(500, 0)`"
            ],
            correct: 0, // Đáp án A
            explanation: "IQR = 200 - 100 = 100; Ngưỡng trên = 200 + 1.5 * 100 = 350. Chỉ có 2 giá lớn hơn 350 là 351 và 500."
        },
        {
            id: "B10-TN-005", dot: 1, type: "TN",
            question: "```python\ns = pd.Series([7, 7, 7, 8, 9, 9])\na = int(s.duplicated().sum())\nb = int(s.duplicated(keep=False).sum())\n```\nCặp `(a,b)` là gì?",
            options: [
                "A. `(5, 3)`",
                "B. `(2, 5)`",
                "C. `(3, 5)`",
                "D. `(3, 6)`"
            ],
            correct: 2, // Đáp án C
            explanation: "Nhóm 7 có 2 dòng dư (duplicated() đếm True cho các dòng lặp sau dòng đầu), nhóm 9 có 1 dòng dư -> a = 3. keep=False đánh dấu tất cả các dòng tham gia nhóm lặp (3 dòng số 7 và 2 dòng số 9) -> b = 5."
        },
        {
            id: "B10-TN-006", dot: 1, type: "TN",
            question: "Mỗi chỗ ở được phép có một quan sát hợp lệ trong mỗi snapshot:\nid=1, snapshot=2026-06\nid=1, snapshot=2026-09\nid=2, snapshot=2026-06\nid=2, snapshot=2026-09\n\nCách xử lý nào phù hợp?",
            options: [
                "A. Giữ 4 dòng; kiểm tra khóa `(id, snapshot)`.",
                "B. Giữ 2 dòng; bỏ dòng lặp theo `id`.",
                "C. Giữ 2 dòng; bỏ dòng lặp theo `snapshot`.",
                "D. Giữ 0 dòng; bỏ mọi dòng có `id` tham gia nhóm lặp."
            ],
            correct: 0, // Đáp án A
            explanation: "Bốn cặp khóa (id, snapshot) đều khác nhau; cùng id ở hai thời điểm là hai quan sát hợp lệ."
        },
        {
            id: "B10-TN-007", dot: 1, type: "TN",
            question: "Hai mặt nạ có cùng chỉ mục:\na = pd.Series([True, False, True, False, False, False])\nb = pd.Series([False, True, True, False, True, False])\n\n`(int((a | b).sum()), int((a & b).sum()))` bằng gì?",
            options: [
                "A. `(5, 1)`",
                "B. `(1, 4)`",
                "C. `(3, 2)`",
                "D. `(4, 1)`"
            ],
            correct: 3, // Đáp án D
            explanation: "Phép OR (a | b) có 4 giá trị True (dòng 0, 1, 2, 4). Phép AND (a & b) chỉ có dòng 2 là True (1 phần tử)."
        },
        {
            id: "B10-TN-008", dot: 1, type: "TN",
            question: "```python\nds = pd.DataFrame({\"id\": [10, 20, 30, 40]})\nrv = pd.DataFrame({\"listing_id\": [10, 10, 20, 99]})\n```\nReview mồ côi có listing_id không tồn tại trong ds.id. Biểu thức nào đếm đúng số **dòng review mồ côi**?",
            options: [
                "A. `(~ds[\"id\"].isin(rv[\"listing_id\"])).sum()`",
                "B. `(~rv[\"listing_id\"].isin(ds[\"id\"])).sum()`",
                "C. `rv[\"listing_id\"].isin(ds[\"id\"]).sum()`",
                "D. `rv[\"listing_id\"].isna().sum()`"
            ],
            correct: 1, // Đáp án B
            explanation: "Kiểm tra xem listing_id trong rv có nằm trong ds.id hay không, phủ định lại rồi sum() đếm số dòng mồ côi."
        },
        {
            id: "B10-TN-009", dot: 1, type: "TN",
            question: "```python\nds = pd.DataFrame({\"id\": [30, 10, 40, 20]})\nrv = pd.DataFrame({\"listing_id\": [10, 10, 20, 30, 30, 30]})\ndem = rv.groupby(\"listing_id\").size()\nds[\"dem_that\"] = ds[\"id\"].map(dem).fillna(0).astype(int)\n```\n`ds[\"dem_that\"].tolist()` trả về gì?",
            options: [
                "A. `[3, 2, 0, 1]`",
                "B. `[2, 1, 3, 0]`",
                "C. `[3, 2, nan, 1]`",
                "D. `[1, 1, 0, 1]`"
            ],
            correct: 0, // Đáp án A
            explanation: "Mã 30 có 3 review, mã 10 có 2, mã 40 không có (fill bằng 0), mã 20 có 1. Map theo thứ tự id của ds [30, 10, 40, 20] cho ra `[3, 2, 0, 1]`."
        },
        {
            id: "B10-TN-010", dot: 1, type: "TN",
            question: "Listings có `(id, number_of_reviews)` là `(10,2)` và `(20,2)`. Reviews gồm:\nlisting_id | date\n10 | 2026-06-29\n10 | 2026-07-01\n20 | 2026-06-28\n20 | 2026-06-29\n\nChính sách đã chọn: **chỉ dùng review không sau 29/06/2026**. Quy trình nào đáp ứng?",
            options: [
                "A. Đổi mốc thành 01/07; giữ reviews và số đếm có sẵn.",
                "B. Giữ mốc 29/06; cắt reviews và giữ số đếm có sẵn.",
                "C. Giữ mốc 29/06; cắt reviews và tính lại số đếm.",
                "D. Giữ mốc 29/06; giữ reviews và trừ 1 ở mọi số đếm."
            ],
            correct: 2, // Đáp án C
            explanation: "Phải thực hiện đúng chính sách (giữ mốc 29/06), cắt lọc lại bảng review và tính toán lại số đếm thống kê cho phù hợp."
        },
        {
            id: "B10-TL-001", dot: 1, type: "TL",
            question: "KPI cần điểm trung bình của các chỗ ở đã có đánh giá, mỗi chỗ ở có trọng số như nhau. Điền 0 rồi tính trung bình cả bốn dòng có phù hợp không? Trả lời một câu, nêu cách tính đúng.",
            answer: "Không phù hợp; chỉ lấy hai chỗ ở đã có đánh giá (loại các giá trị NaN), nên trung bình là (4.0 + 5.0) / 2 = 4.5.",
            explanation: "Điểm chưa quan sát khác điểm 0; không được biến dữ liệu thiếu thành điểm 0 để tính toán KPI."
        },
        {
            id: "B10-TL-002", dot: 1, type: "TL",
            question: "Viết hai dòng tạo `ten_trong` (thiếu, rỗng hoặc toàn khoảng trắng) và `diem_ngoai_thang` (điểm quan sát ngoài [0,5], hai biên hợp lệ). Điểm thiếu kiểm riêng.",
            answer: "```python\nten_trong = d[\"name\"].isna() | d[\"name\"].str.strip().eq(\"\")\ndiem_ngoai_thang = d[\"review_scores_rating\"].notna() & ~d[\"review_scores_rating\"].between(0, 5)\n```",
            explanation: "Dùng isna kết hợp với str.strip().eq('') để bắt chuỗi trống/khoảng trắng. Dùng notna kết hợp between để lọc điểm hợp lệ ngoài khoảng [0, 5]."
        },
        {
            id: "B10-TL-003", dot: 1, type: "TL",
            question: "Reviews rút gọn chỉ có hai cột (listing_id, date). Hai khách khác nhau có thể đánh giá cùng chỗ ở trong cùng ngày. Có nên chạy `drop_duplicates(subset=[\"listing_id\",\"date\"])` để làm sạch không? Trả lời một câu và giải thích.",
            answer: "Không nên, vì hai khách khác nhau hoàn toàn có thể đánh giá cùng một chỗ ở trong cùng một ngày, nên cặp cột này không định danh duy nhất từng review.",
            explanation: "Trùng theo tập cột chỉ là căn cứ xóa khi tập cột đó thực sự là khóa định danh phù hợp của bảng."
        },
        {
            id: "B10-TL-004", dot: 1, type: "TL",
            question: "Cả năm review đều thuộc chỗ ở 10, có ngày `2025-06-29`, `2025-06-30`, `2026-06-29`, `2026-06-30`, `2026-07-01`. Cột có sẵn `number_of_reviews_ltm = 3`. Cửa sổ tự đếm là **30/06/2025 đến 29/06/2026, gồm cả hai đầu**. Tính **cột có sẵn − số tự đếm**. Chỉ trả lời một con số.",
            answer: "1",
            explanation: "Số review tự đếm trong cửa sổ [2025-06-30, 2026-06-29] là 2 review (ngày 30/06/2025 và 29/06/2026). Ta có: 3 - 2 = 1."
        },
        {
            id: "B10-TL-005", dot: 1, type: "TL",
            question: "`report` có ba cột `quy_tac`, `so_dong`, `ghi_chu` và hai dòng. Viết hai dòng ghi toàn bộ bảng vào `qa_report_reviews.csv` không thêm cột index, rồi đọc lại vào `kq` để kiểm tra.",
            answer: "```python\nreport.to_csv(\"qa_report_reviews.csv\", index=False)\nkq = pd.read_csv(\"qa_report_reviews.csv\")\n```",
            explanation: "Sử dụng tham số `index=False` để tránh việc ghi thêm cột chỉ mục mặc định của Pandas vào tệp CSV."
        },

        // --- ĐỢT 2 ---
        {
            id: "B10-TN-011", dot: 2, type: "TN",
            question: "```python\nd = pd.DataFrame({\n    \"price_num\": [100., np.nan, 300., 200.],\n    \"bedrooms\": [np.nan, 1., 2., np.nan]\n})\nkpi = d.dropna(subset=[\"price_num\"])\n```\nGiá tính bằng nghìn đồng/đêm. Cặp `(len(kpi), kpi[\"price_num\"].mean())` bằng gì?",
            options: [
                "A. `(1, 300.0)`",
                "B. `(4, 150.0)`",
                "C. `(3, 200.0)`",
                "D. `(3, 600.0)`"
            ],
            correct: 2, // Đáp án C
            explanation: "Loại dòng thiếu price_num (dòng 1 bị loại), còn 3 dòng [100, 300, 200]. Trung bình là (100+300+200)/3 = 200.0."
        },
        {
            id: "B10-TN-012", dot: 2, type: "TN",
            question: "```python\np = pd.Series([np.nan, 0., -5., 100.], dtype=\"float64\")\na = p.isna()\nb = p <= 0\n```\nCặp **(số giá thiếu, số giá không dương)** bằng gì?",
            options: [
                "A. `(1, 2)`",
                "B. `(1, 3)`",
                "C. `(0, 2)`",
                "D. `(1, 1)`"
            ],
            correct: 0, // Đáp án A
            explanation: "Số giá thiếu (NaN) là 1. Số giá không dương (<= 0) gồm 0. và -5, tổng cộng là 2 (NaN không thỏa mãn điều kiện so sánh số học)."
        },
        {
            id: "B10-TN-013", dot: 2, type: "TN",
            question: "Trong bối cảnh này, nhóm đã xác nhận quy tắc `minimum_nights > 365` cần gắn cờ. Bốn giá trị là `1, 365, 366, 999`, đơn vị đêm, không thiếu. Có bao nhiêu dòng bị gắn cờ?",
            options: [
                "A. 3",
                "B. 1",
                "C. 4",

    // Hàm render danh sách câu hỏi
    function renderQuestions(filterDot = "all", filterType = "all") {
        const container = document.getElementById("questions-container");
        container.innerHTML = "";

        const filtered = questionsData.filter(q => {
            const matchDot = (filterDot === "all" || q.dot.toString() === filterDot);
            const matchType = (filterType === "all" || q.type === filterType);
            return matchDot && matchType;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #64748b; padding: 40px;">Không tìm thấy câu hỏi phù hợp.</p>`;
            return;
        }

        filtered.forEach((q, index) => {
            const card = document.createElement("div");
            card.className = "question-card";
            card.id = `card-${q.id}`;

            let headerHTML = `
                <div class="question-header">
                    <span>${q.id} (Đợt ${q.dot})</span>
                    <span class="badge ${q.type === 'TL' ? 'badge-tl' : ''}">${q.type === 'TN' ? 'Trắc nghiệm' : 'Trả lời ngắn'}</span>
                </div>
            `;

            let bodyHTML = `<div class="question-content">${escapeHTML(q.question)}</div>`;

            if (q.type === 'TN') {
                bodyHTML += `<div class="options-list">`;
                q.options.forEach((opt, optIndex) => {
                    bodyHTML += `<button class="option-btn" onclick="checkAnswer('${q.id}', ${optIndex})">${escapeHTML(opt)}</button>`;
                });
                bodyHTML += `</div>`;
            } else {
                bodyHTML += `
                    <div class="short-answer-section">
                        <button class="btn-toggle-answer" onclick="toggleShortAnswer('${q.id}')">Xem đáp án & giải thích</button>
                    </div>
                `;
            }

            // Hộp giải thích chung
            bodyHTML += `
                <div class="explanation-box" id="exp-${q.id}">
                    <div class="explanation-title">Đáp án & Giải thích:</div>
                    <div>${formatAnswerText(q.answer || q.options[q.correct])}</div>
                    <div style="margin-top: 8px;"><em>${escapeHTML(q.explanation)}</em></div>
                </div>
            `;

            card.innerHTML = headerHTML + bodyHTML;
            container.appendChild(card);
        });
    }

    // Xử lý chọn đáp án trắc nghiệm
    function checkAnswer(questionId, selectedIndex) {
        const q = questionsData.find(item => item.id === questionId);
        const card = document.getElementById(`card-${questionId}`);
        const buttons = card.querySelectorAll(".option-btn");

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.correct) {
                btn.classList.add("correct");
            } else if (idx === selectedIndex) {
                btn.classList.add("incorrect");
            }
        });

        // Hiển thị khung giải thích
        const expBox = document.getElementById(`exp-${questionId}`);
        expBox.classList.add("show");
    }

    // Xử lý hiển thị đáp án câu trả lời ngắn
    function toggleShortAnswer(questionId) {
        const expBox = document.getElementById(`exp-${questionId}`);
        expBox.classList.toggle("show");
    }

    // Lọc câu hỏi
    function filterQuestions() {
        const dot = document.getElementById("filter-dot").value;
        const type = document.getElementById("filter-type").value;
        renderQuestions(dot, type);
    }

    // Làm lại từ đầu
    function resetAnswers() {
        document.getElementById("filter-dot").value = "all";
        document.getElementById("filter-type").value = "all";
        renderQuestions("all", "all");
    }

    // Tiện ích thoát ký tự HTML cơ bản để tránh lỗi hiển thị
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    // Định dạng đoạn mã code bên trong đáp án (nếu có dấu ```python ... ```)
    function formatAnswerText(text) {
        if (!text) return "";
        // Chuyển đổi block code markdown đơn giản thành thẻ <pre>
        let formatted = escapeHTML(text);
        formatted = formatted.replace(/```python([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        return formatted.replace(/\n/g, '<br>');
    }

    // Khởi chạy khi tải trang
    window.onload = function() {
        renderQuestions();
    };
</script>
