<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Chuyên sâu: Biến thể & Tình huống Mới (Lectures 02 — 05)</title>
<style>
  :root{
    --bg:#0d1117;
    --surface:#151b23;
    --surface-2:#1c2530;
    --border:#2a3441;
    --border-soft:#212a35;
    --text:#e6edf3;
    --text-dim:#8b98a5;
    --text-faint:#5b6773;
    --accent:#4fd1c5;
    --accent-dim:#2a7a72;
    --amber:#e8b34c;
    --amber-dim:#7a5e26;
    --red:#f0665e;
    --green:#4fd18c;
    --purple:#b392f0;
    --mono:'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.55;
    min-height:100vh;
    padding:24px 16px 80px;
  }
  .wrap{max-width:860px;margin:0 auto;}

  .topbar{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border-soft);
    flex-wrap:wrap;gap:10px;
  }
  .topbar h1{font-size:18px;font-weight:600;letter-spacing:-0.01em;}
  .topbar h1 span{color:var(--accent);}
  .topbar .sub{font-size:12.5px;color:var(--text-faint);margin-top:4px;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:22px;
    margin-bottom:16px;
  }
  .setup-title{font-size:13.5px;font-weight:600;color:var(--text-dim);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .topic-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(255px, 1fr));gap:8px;margin-bottom:12px;}
  .topic-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;background:var(--surface-2);border:1px solid var(--border-soft);
    border-radius:8px;cursor:pointer;font-size:13px;transition:border-color .12s,background .12s;
  }
  .topic-row:hover{border-color:var(--accent-dim);}
  .topic-row input{accent-color:var(--accent);width:15px;height:15px;flex-shrink:0;}
  .topic-row .count{margin-left:auto;color:var(--text-faint);font-size:11px;font-family:var(--mono);}

  .row-inline{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .seg{
    display:flex;background:var(--surface-2);border:1px solid var(--border-soft);
    border-radius:8px;overflow:hidden;flex:1;min-width:220px;
  }
  .seg button{
    flex:1;background:none;border:none;color:var(--text-dim);padding:9px 10px;
    font-size:12.5px;font-family:var(--sans);cursor:pointer;transition:.12s;
  }
  .seg button.active{background:var(--accent-dim);color:#fff;font-weight:500;}

  .numinput{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid var(--border-soft);border-radius:8px;padding:8px 12px;font-size:13px;
  }
  .numinput input{
    background:none;border:none;color:var(--text);font-family:var(--mono);
    width:52px;font-size:13.5px;outline:none;text-align:center;
  }

  .start-btn{
    width:100%;background:var(--accent);color:#06201d;border:none;border-radius:8px;
    padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;transition:opacity .12s;
    font-family:var(--sans);margin-top:10px;
  }
  .start-btn:hover{opacity:.9;}

  .progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .progress-bar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);transition:width .25s;}
  .progress-txt{font-size:12px;color:var(--text-faint);font-family:var(--mono);white-space:nowrap;}

  .qbadge{
    display:inline-block;font-size:11px;font-family:var(--mono);color:var(--accent);
    background:rgba(79,209,197,.1);border:1px solid var(--accent-dim);
    padding:3px 9px;border-radius:20px;margin-bottom:12px;
  }
  .qbadge.essay{color:var(--amber);background:rgba(232,179,76,.1);border-color:var(--amber-dim);}
  .qbadge.strides{color:var(--purple);background:rgba(179,146,240,.1);border-color:var(--purple);}
  .qbadge.pandas{color:#ff79c6;background:rgba(255,121,198,.1);border-color:#ff79c6;}
  .qbadge.pts{float:right;color:var(--text-faint);border-color:transparent;background:none;font-size:12px;}

  .qtext{font-size:15px;margin-bottom:14px;line-height:1.6;}
  .qtext code, .opt code, .code-block code, .explain-box code{
    font-family:var(--mono);background:rgba(79,209,197,.12);color:var(--accent);
    padding:1px 6px;border-radius:4px;font-size:.92em;
  }
  .code-block{
    background:#0a0e14;border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 16px;margin:10px 0 14px;overflow-x:auto;
  }
  .code-block pre{font-family:var(--mono);font-size:13px;color:#c3d4de;white-space:pre;line-height:1.55;}

  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .opt{
    display:flex;align-items:flex-start;gap:11px;padding:11px 14px;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;
    cursor:pointer;font-size:13.5px;transition:border-color .1s,background .1s;
  }
  .opt:hover{border-color:var(--accent-dim);}
  .opt .dot{
    width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text-faint);
    flex-shrink:0;margin-top:2px;position:relative;
  }
  .opt.selected{border-color:var(--accent);background:rgba(79,209,197,.06);}
  .opt.selected .dot{border-color:var(--accent);}
  .opt.selected .dot::after{
    content:'';position:absolute;inset:3px;background:var(--accent);border-radius:50%;
  }
  .opt.correct{border-color:var(--green)!important;background:rgba(79,209,140,.09)!important;}
  .opt.correct .dot{border-color:var(--green);background:var(--green);}
  .opt.wrong{border-color:var(--red)!important;background:rgba(240,102,94,.09)!important;}
  .opt.wrong .dot{border-color:var(--red);background:var(--red);}
  .opt.disabled{cursor:default;}

  .short-input-box{display:flex;gap:10px;margin-bottom:12px;}
  .essay-input{
    flex:1;background:var(--surface-2);border:1px solid var(--border-soft);
    border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--mono);
    font-size:13.5px;outline:none;
  }
  .essay-input:focus{border-color:var(--accent-dim);}

  .explain-box{
    margin-top:14px;padding:14px 16px;background:rgba(232,179,76,.06);
    border:1px solid var(--amber-dim);border-left:3px solid var(--amber);
    border-radius:8px;font-size:13px;color:#d9c9a3;line-height:1.65;
  }
  .explain-box.correct-box{
    background:rgba(79,209,140,.06);border-color:rgba(79,209,140,.3);border-left:3px solid var(--green);
    color:#b6ecd0;
  }
  .explain-box b{color:var(--amber);}
  .explain-box.correct-box b{color:var(--green);}

  .nav-row{display:flex;gap:10px;margin-top:16px;}
  .btn{
    padding:11px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--sans);
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:500;
    transition:all .12s;
  }
  .btn:hover{border-color:var(--accent-dim);}
  .btn.primary{background:var(--accent);color:#06201d;border:none;font-weight:600;}
  .btn.primary:hover{opacity:.88;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.grow{flex:1;}

  .canvas-q-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:20px;margin-bottom:20px;position:relative;
  }
  .canvas-q-header{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--border-soft);
    font-weight:600;font-size:14.5px;color:var(--text);
  }
  .canvas-pts{color:var(--text-faint);font-size:12px;font-family:var(--mono);}

  .score-hero{text-align:center;padding:26px 10px 16px;}
  .score-num{font-size:54px;font-weight:700;font-family:var(--mono);color:var(--accent);}
  .score-num span{font-size:22px;color:var(--text-faint);}
  .score-sub{color:var(--text-dim);font-size:13.5px;margin-top:6px;}

  .review-item{border-bottom:1px solid var(--border-soft);padding:16px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-head{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .review-mark{flex-shrink:0;font-size:15px;margin-top:1px;}
  .review-mark.ok{color:var(--green);}
  .review-mark.bad{color:var(--red);}
  .review-q{font-size:13.5px;line-height:1.5;}

  .key-shortcut-hint{font-size:11px;color:var(--text-faint);text-align:right;margin-top:6px;}
  .footer-note{text-align:center;color:var(--text-faint);font-size:12px;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Ôn tập Chuyên sâu: <span>Biến thể & Tình huống Mới</span></h1>
      <div class="sub">50 câu hỏi mới · Tráo đổi số liệu & kịch bản · Strides âm, Alignment, Broadcaster, Exception</div>
    </div>
  </div>

  <div id="app"></div>
  <div class="footer-note">Hỗ trợ phím tắt: 1-4 chọn phương án · Enter/→ câu sau · ← câu trước</div>
</div>

<script>
/* ============ BIẾN THỂ NGÂN HÀNG CÂU HỎI (50 CÂU MỚI TOÀN BỘ) ============ */
const TOPICS = {
  py_core: "L02: Python Cơ bản, Set & Môi trường",
  py_flow: "L02: Ngoại lệ, Chuỗi & Đọc CSV/JSON",
  numpy_shape: "L03: NumPy Shape, View & Copy",
  numpy_strides: "L03: Strides, Memory Layout & Broadcaster",
  numpy_calc: "L03: NumPy Thống kê, Mask & Axis",
  pandas_basic: "L04: Pandas Series & Alignment",
  pandas_adv: "L05: DataFrame Chuyên sâu & Chained Index"
};

const BANK = [
  /* ---------------- L02: PYTHON CORE, SET, VENV ---------------- */
  {
    id: "v1", topic: "py_core", type: "mcq",
    q: `Danh sách sinh viên hoàn thành bài tập ở hai tuần được lưu bằng hai tập hợp:<br><div class="code-block"><pre>tuan_1 = {"Huy", "Lan", "Minh", "Quang"}
tuan_2 = {"Lan", "Nam", "Quang", "Việt"}</pre></div>Biểu thức nào cho ra đúng <code>{'Nam', 'Việt'}</code> (những bạn chỉ nộp ở tuần 2 mà không nộp tuần 1)?`,
    opts: ["tuan_1 - tuan_2", "tuan_2 - tuan_1", "tuan_1 ^ tuan_2", "tuan_2 & tuan_1"],
    correct: 1,
    explain: `Phép hiệu tập hợp <code>tuan_2 - tuan_1</code> giữ lại các phần tử có trong tuan_2 nhưng vắng mặt ở tuan_1 (tức Nam và Việt). Đảo ngược <code>tuan_1 - tuan_2</code> ra {'Huy', 'Minh'}. Phép đối xứng <code>^</code> sẽ gộp cả 4 người.`
  },
  {
    id: "v2", topic: "py_core", type: "mcq",
    q: `Vẫn với hai tập hợp <code>tuan_1</code> và <code>tuan_2</code> ở câu trên. Biểu thức nào trả về những bạn nộp bài ở <b>cả hai tuần</b>?`,
    opts: ["tuan_1 & tuan_2", "tuan_1 | tuan_2", "tuan_1 ^ tuan_2", "tuan_1 - tuan_2"],
    correct: 0,
    explain: `Toán tử <code>&</code> (intersection) lấy giao của hai tập hợp, trả về những sinh viên có mặt ở cả hai tuần là Lan và Quang.`
  },
  {
    id: "v3", topic: "py_core", type: "mcq",
    q: `Một đồng nghiệp gửi cho bạn một file nén mã nguồn chứa toàn bộ thư mục môi trường ảo <code>.venv/</code> từ máy Ubuntu của họ sang máy Windows của bạn. Khi bạn chạy lệnh <code>python main.py</code> trong môi trường đó, lỗi xảy ra do đâu?`,
    opts: [
      "File .venv chứa các đường dẫn tuyệt đối và file thực thi nhị phân phụ thuộc hệ điều hành máy gốc, không thể dùng chéo máy.",
      "Python trên Windows không hỗ trợ thư mục ẩn bắt đầu bằng dấu chấm.",
      "Thư mục .venv chỉ dùng được khi có kết nối Internet để đồng bộ với server.",
      "Lệnh gọi file phải là python3 chứ Windows không nhận lệnh python."
    ],
    correct: 0,
    explain: `Môi trường ảo (virtual environment) gắn chặt với đường dẫn tuyệt đối (absolute path) và tệp nhị phân riêng của hệ điều hành đã biên dịch ra nó. Nguyên tắc chuẩn là chỉ chia sẻ <code>requirements.txt</code> hoặc file cấu hình để tạo lại venv mới trên máy đích.`
  },
  {
    id: "v4", topic: "py_core", type: "mcq",
    q: `Đoạn mã sau in ra giá trị gì trên màn hình?<div class="code-block"><pre>def push_val(val, storage={}):
    storage[val] = len(storage)
    return storage

push_val('A')
res = push_val('B')
print(len(res), res['B'])</pre></div>`,
    opts: ["2 1", "1 0", "2 0", "Ném lỗi KeyError"],
    correct: 0,
    explain: `Đối số mặc định <code>storage={}</code> là một dictionary mutable và được tạo duy nhất một lần. Lần gọi 1 thêm 'A' (độ dài ban đầu 0) -> storage={'A': 0}. Lần gọi 2 thêm 'B' (độ dài lúc này là 1) -> storage={'A': 0, 'B': 1}. Kết quả độ dài là 2 và giá trị của 'B' là 1.`
  },
  {
    id: "v5", topic: "py_core", type: "mcq",
    q: `Khi hoàn thiện bài tập thực hành trên Jupyter Notebook có dùng trợ lý code AI để viết các hàm xử lý dữ liệu phức tạp, quy tắc chuẩn mực học thuật yêu cầu sinh viên phải:`,
    opts: [
      "Xóa toàn bộ dấu vết gợi ý và chỉ để lại code cuối cùng để tránh bị trừ điểm.",
      "Minh bạch ghi rõ câu prompt đã dùng và mô tả cách bản thân đã viết ca kiểm thử (test case) để kiểm chứng tính đúng đắn.",
      "Chụp ảnh màn hình cuộc trò chuyện và gửi qua email cho giảng viên thay vì để trong notebook.",
      "Chỉ cần chú thích tên phiên bản mô hình AI (ví dụ GPT-4 hoặc Claude) ở dòng comment đầu tiên của notebook."
    ],
    correct: 1,
    explain: `Quy tắc liêm chính học thuật đòi hỏi sinh viên phải minh bạch tại chỗ: lưu lại prompt chính đã truy vấn và trình bày cách thức kiểm chứng tính chính xác của kết quả mà AI sinh ra.`
  },
  {
    id: "v6", topic: "py_core", type: "mcq",
    q: `Kết quả in ra của đoạn mã sau là gì?<div class="code-block"><pre>data = {'k': [10, 20]}
backup = data.copy()
backup['k'].append(30)
backup['new'] = 99
print(len(data['k']), 'new' in data)</pre></div>`,
    opts: ["3 False", "2 False", "3 True", "2 True"],
    correct: 0,
    explain: `Phương thức <code>.copy()</code> của dict là shallow copy. Danh sách con tại key 'k' được chia sẻ chung bộ nhớ, nên lệnh <code>append(30)</code> tác động lên cả <code>data['k']</code> (độ dài thành 3). Việc thêm key mới <code>backup['new']</code> chỉ tác động lên dict <code>backup</code>, do đó <code>'new' in data</code> trả về False.`
  },
  {
    id: "v7", topic: "py_core", type: "short",
    q: `Cho hai danh sách: <code>x = [1, 2, 3]</code> và <code>y = [1, 2, 3]</code>. Biểu thức <code>(x == y) + (x is y)</code> in ra giá trị bằng bao nhiêu? Chỉ trả lời bằng một con số nguyên.`,
    answer: "1",
    explain: `<code>x == y</code> so sánh giá trị các phần tử, trả về True (bằng 1). <code>x is y</code> kiểm tra định danh ô nhớ trong RAM: do x và y là hai danh sách độc lập được tạo riêng biệt nên trả về False (bằng 0). Tổng: 1 + 0 = 1.`
  },

  /* ---------------- L02: EXCEPTION, STRINGS, CSV/JSON ---------------- */
  {
    id: "v8", topic: "py_flow", type: "mcq",
    q: `Hàm sau đây dùng để chuyển đổi chuỗi sang float từ file log: <code>def parse_speed(s): return float(s)</code>. Khi gặp dữ liệu lỗi là chuỗi không hợp lệ <code>"N/A"</code> hoặc giá trị rỗng <code>None</code>, muốn bắt chính xác hai lỗi này mà không che giấu lỗi code khác, cần dùng khối ngoại lệ nào?`,
    opts: [
      "except (ValueError, TypeError):",
      "except (TypeError, KeyError):",
      "except (ValueError, AttributeError):",
      "except Exception:"
    ],
    correct: 0,
    explain: `<code>float("N/A")</code> ném <code>ValueError: could not convert string to float</code>, còn <code>float(None)</code> ném <code>TypeError: float() argument must be a string or a real number</code>. Cặp ngoại lệ <code>(ValueError, TypeError)</code> là vừa đủ và khít nhất.`
  },
  {
    id: "v9", topic: "py_flow", type: "mcq",
    q: `Cho <code>rate = 0.0875</code> và <code>budget = 4500000</code>. Biểu thức nào định dạng ra chính xác chuỗi: <code>"Lãi suất: 8.8% | Ngân sách: 4,500,000 VND"</code>?`,
    opts: [
      `f"Lãi suất: {rate:.1%} | Ngân sách: {budget:,} VND"`,
      `f"Lãi suất: {rate * 100:.1f}% | Ngân sách: {budget:d} VND"`,
      `f"Lãi suất: {rate:.1f}% | Ngân sách: {budget:,} VND"`,
      `f"Lãi suất: {rate * 100:.1%} | Ngân sách: {budget:,} VND"`
    ],
    correct: 0,
    explain: `Đặc tả <code>:.1%</code> tự động nhân giá trị với 100, làm tròn đến 1 chữ số thập phân và gắn ký hiệu % (0.0875 -> 8.8%). Đặc tả <code>:,</code> tự động chèn dấu phẩy phân tách hàng nghìn.`
  },
  {
    id: "v10", topic: "py_flow", type: "mcq",
    q: `File <code>sanpham.csv</code> chứa hai cột <code>ma_sp,gia_tien</code>. Đoạn mã sau bị lỗi ở dòng nào và vì sao?<div class="code-block"><pre>with open('sanpham.csv') as f:
    r = csv.reader(f)
    next(r) # bỏ header
    total = sum(float(row[1]) for row in r if row[1] != "")</pre></div>`,
    opts: [
      "Không bị lỗi cú pháp; nếu cột gia_tien có định dạng chứa dấu phẩy '1,500.0' thì float() sẽ ném ValueError.",
      "Bị lỗi vì csv.reader bắt buộc phải truyền delimiter=';'.",
      "Bị lỗi vì sum() không nhận generator expression lồng if.",
      "Bị lỗi vì next() chỉ dùng được cho iterator của từ điển chứ không dùng cho csv.reader."
    ],
    correct: 0,
    explain: `Hàm chuẩn <code>float()</code> trong Python không chấp nhận chuỗi chứa dấu phẩy ngăn cách hàng nghìn (như '1,500.0'). Nếu chuỗi có định dạng này, lệnh sẽ ném <code>ValueError</code> nếu không loại bỏ dấu phẩy trước.`
  },

/* ============ STATE MANAGEMENT ============ */
let selectedTopics = new Set(Object.keys(TOPICS));
let mode = "practice";
let qtype = "mix";
let qcount = 25;
let pool = [];
let currentIdx = 0;
let userAnswers = {};

const app = document.getElementById('app');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function countForTopic(t){
  return BANK.filter(q => q.topic === t).length;
}

/* ============ SETUP VIEW ============ */
function renderSetup(){
  let topicHtml = Object.entries(TOPICS).map(([key, label]) => `
    <label class="topic-row">
      <input type="checkbox" data-topic="${key}" ${selectedTopics.has(key)?'checked':''}>
      <span>${label}</span>
      <span class="count">${countForTopic(key)} câu</span>
    </label>`).join('');

  app.innerHTML = `
    <div class="card">
      <div class="setup-title">1. Chọn bài học / chủ đề chuyên sâu</div>
      <div class="topic-grid">${topicHtml}</div>

      <div class="setup-title">2. Dạng câu hỏi</div>
      <div class="row-inline">
        <div class="seg" id="qtype-seg">
          <button data-v="mix" class="${qtype==='mix'?'active':''}">Hỗn hợp (Trắc nghiệm + Trả lời ngắn)</button>
          <button data-v="mcq" class="${qtype==='mcq'?'active':''}">Chỉ trắc nghiệm</button>
          <button data-v="short" class="${qtype==='short'?'active':''}">Chỉ điền số / đáp án ngắn</button>
        </div>
      </div>

      <div class="setup-title">3. Chế độ giao diện & Trải nghiệm</div>
      <div class="row-inline">
        <div class="seg" id="mode-seg">
          <button data-v="practice" class="${mode==='practice'?'active':''}">Luyện tập (Từng câu & Xem giải thích ngay)</button>
          <button data-v="exam" class="${mode==='exam'?'active':''}">Thi thử (Từng câu & Nộp bài cuối)</button>
          <button data-v="canvas" class="${mode==='canvas'?'active':''}">Đề thi Canvas LMS (Toàn bộ 1 trang)</button>
        </div>
      </div>

      <div class="setup-title">4. Số lượng câu hỏi (Tối đa ${BANK.length} câu)</div>
      <div class="row-inline">
        <div class="numinput">
          <button onclick="adjustCount(-5)" style="background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:0 5px;">−</button>
          <input type="text" id="qcount-input" value="${qcount}" readonly>
          <button onclick="adjustCount(5)" style="background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:0 5px;">+</button>
        </div>
      </div>

      <button class="start-btn" id="start-btn">Bắt đầu làm bài</button>
    </div>
  `;

  document.querySelectorAll('.topic-row input').forEach(cb => {
    cb.addEventListener('change', e => {
      const t = e.target.dataset.topic;
      if(e.target.checked) selectedTopics.add(t); else selectedTopics.delete(t);
    });
  });

  document.querySelectorAll('#qtype-seg button').forEach(b => {
    b.addEventListener('click', ()=>{ qtype = b.dataset.v; renderSetup(); });
  });

  document.querySelectorAll('#mode-seg button').forEach(b => {
    b.addEventListener('click', ()=>{ mode = b.dataset.v; renderSetup(); });
  });

  document.getElementById('start-btn').addEventListener('click', startQuiz);
}

function adjustCount(delta){
  qcount = Math.max(5, Math.min(BANK.length, qcount + delta));
  document.getElementById('qcount-input').value = qcount;
}
window.adjustCount = adjustCount;

/* ============ QUIZ INITIALIZATION ============ */
function startQuiz(){
  let source = BANK.filter(q => selectedTopics.has(q.topic));
  if(qtype === 'mcq') source = source.filter(q => q.type === 'mcq');
  else if(qtype === 'short') source = source.filter(q => q.type === 'short');

  if(source.length === 0){
    alert('Không có câu hỏi nào thỏa mãn các bộ lọc. Vui lòng chọn thêm chủ đề!');
    return;
  }

  source = shuffle(source).map(q => {
    if(q.type === 'short') return { ...q };
    const order = shuffle(q.opts.map((_, i) => i));
    return {
      ...q,
      displayOpts: order.map(i => q.opts[i]),
      correctDisplay: order.indexOf(q.correct)
    };
  });

  pool = source.slice(0, Math.min(qcount, source.length));
  currentIdx = 0;
  userAnswers = {};

  if(mode === 'canvas'){
    renderCanvasFullView();
  } else {
    renderStepQuestion();
  }
}

/* ============ STEP-BY-STEP (Practice & Exam Mode) ============ */
function renderStepQuestion(){
  const q = pool[currentIdx];
  const pct = Math.round((currentIdx / pool.length) * 100);
  let contentHtml = '';

  const saved = userAnswers[q.id];
  const isPandas = q.topic.includes('pandas');
  const isStrides = q.topic.includes('strides');

  let badgeClass = '';
  if(isStrides) badgeClass = 'strides';
  else if(isPandas) badgeClass = 'pandas';

  if(q.type === 'short'){
    contentHtml = `
      <div class="qbadge essay">Điền đáp án · ${TOPICS[q.topic]}</div>
      <span class="qbadge pts">1 pt</span>
      <div class="qtext">${q.q}</div>
      <div class="short-input-box">
        <input type="text" class="essay-input" id="short-val" placeholder="Nhập đáp án (số hoặc NaN)..." value="${saved ? saved.value : ''}" ${mode==='practice' && saved ? 'disabled' : ''}>
        ${mode === 'practice' ? `<button class="btn primary" id="check-short-btn" ${saved ? 'disabled':''}>Kiểm tra</button>` : ''}
      </div>
      <div id="feedback-area"></div>
    `;
  } else {
    const optsHtml = q.displayOpts.map((optText, i) => {
      let extraClass = '';
      if(saved && saved.value === i) extraClass += ' selected';
      if(mode === 'practice' && saved){
        extraClass += ' disabled';
        if(i === q.correctDisplay) extraClass += ' correct';
        else if(saved.value === i) extraClass += ' wrong';
      }
      return `
        <div class="opt ${extraClass}" data-i="${i}">
          <div class="dot"></div>
          <div class="label"><code>[${i+1}]</code> ${optText}</div>
        </div>`;
    }).join('');

    contentHtml = `
      <div class="qbadge ${badgeClass}">Trắc nghiệm · ${TOPICS[q.topic]}</div>
      <span class="qbadge pts">1 pt</span>
      <div class="qtext">${q.q}</div>
      <div class="opts">${optsHtml}</div>
      <div id="feedback-area"></div>
      <div class="key-shortcut-hint">Phím tắt: [1]-[4] chọn đáp án · [←] câu trước · [Enter/→] câu tiếp</div>
    `;
  }

  const isFirst = (currentIdx === 0);
  const isLast = (currentIdx === pool.length - 1);

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-txt">Câu ${currentIdx + 1} / ${pool.length}</div>
    </div>
    <div class="card">${contentHtml}</div>
    <div class="nav-row">
      <button class="btn" id="quit-btn">Thoát</button>
      <button class="btn" id="prev-btn" ${isFirst ? 'disabled' : ''}>← Câu trước</button>
      <button class="btn primary grow" id="next-btn">${isLast ? 'Nộp bài / Xem kết quả' : 'Câu tiếp theo →'}</button>
    </div>
  `;

  document.getElementById('quit-btn').addEventListener('click', () => {
    if(confirm('Quay về màn hình cài đặt?')) renderSetup();
  });
  document.getElementById('prev-btn').addEventListener('click', goPrevStep);
  document.getElementById('next-btn').addEventListener('click', goNextStep);

  if(q.type === 'short'){
    const inputEl = document.getElementById('short-val');
    inputEl.focus();
    inputEl.addEventListener('keydown', e => { 
      if(e.key === 'Enter') handleShortSubmit(); 
    });

    if(mode === 'practice'){
      document.getElementById('check-short-btn').addEventListener('click', handleShortSubmit);
      if(saved) showExplanation(saved.isCorrect, `Đáp án chuẩn: <code>${q.answer}</code><br>${q.explain}`);
    }
  } else {
    if(mode === 'practice' && saved){
      showExplanation(saved.isCorrect, q.explain);
    }
    document.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        if(mode === 'practice' && userAnswers[q.id]) return;
        const chosen = parseInt(el.dataset.i);
        handleOptionSelect(chosen);
      });
    });
  }
}

function handleOptionSelect(chosen){
  const q = pool[currentIdx];
  const isCorrect = (chosen === q.correctDisplay);
  userAnswers[q.id] = { value: chosen, isCorrect };

  if(mode === 'practice'){
    document.querySelectorAll('.opt').forEach((o, i) => {
      o.classList.add('disabled');
      if(i === q.correctDisplay) o.classList.add('correct');
      else if(i === chosen) o.classList.add('wrong');
    });
    showExplanation(isCorrect, q.explain);
  } else {
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    document.querySelector(`.opt[data-i="${chosen}"]`).classList.add('selected');
  }
}

function handleShortSubmit(){
  const q = pool[currentIdx];
  const val = (document.getElementById('short-val').value || '').trim();
  const isCorrect = (val.toLowerCase() === q.answer.toLowerCase());
  userAnswers[q.id] = { value: val, isCorrect };

  if(mode === 'practice'){
    document.getElementById('short-val').disabled = true;
    const btn = document.getElementById('check-short-btn');
    if(btn) btn.disabled = true;
    showExplanation(isCorrect, `Đáp án chuẩn: <code>${q.answer}</code><br>${q.explain}`);
  } else {
    goNextStep();
  }
}

function showExplanation(isOk, text){
  const area = document.getElementById('feedback-area');
  if(!area) return;
  area.innerHTML = `
    <div class="explain-box ${isOk ? 'correct-box' : ''}">
      <b>${isOk ? '✓ Chính xác!' : '✕ Chưa chính xác!'}</b><br>${text}
    </div>
  `;
}

function syncCurrentAnswer(){
  const q = pool[currentIdx];
  if(!q) return;
  if(q.type === 'short'){
    const inputEl = document.getElementById('short-val');
    if(inputEl){
      const val = inputEl.value.trim();
      if(val !== ''){
        userAnswers[q.id] = { value: val, isCorrect: val.toLowerCase() === q.answer.toLowerCase() };
      }
    }
  }
}

function goPrevStep(){
  if(currentIdx <= 0) return;
  syncCurrentAnswer();
  currentIdx--;
  renderStepQuestion();
}

function goNextStep(){
  syncCurrentAnswer();
  currentIdx++;
  if(currentIdx >= pool.length) renderResults();
  else renderStepQuestion();
}

/* ============ FULL CANVAS LMS VIEW ============ */
function renderCanvasFullView(){
  let questionsHtml = pool.map((q, idx) => {
    let inner = '';
    if(q.type === 'short'){
      inner = `
        <div class="qtext">${q.q}</div>
        <div style="max-width:320px;margin-top:10px;">
          <input type="text" class="essay-input" id="c-ans-${q.id}" placeholder="Your Answer...">
        </div>
      `;
    } else {
      const optsHtml = q.displayOpts.map((optText, i) => `
        <div class="opt" data-qid="${q.id}" data-i="${i}" id="c-opt-${q.id}-${i}">
          <div class="dot"></div>
          <div class="label">${optText}</div>
        </div>
      `).join('');
      inner = `
        <div class="qtext">${q.q}</div>
        <div class="opts">${optsHtml}</div>
      `;
    }

    return `
      <div class="canvas-q-card" id="card-${q.id}">
        <div class="canvas-q-header">
          <span>Question ${idx + 1}</span>
          <span class="canvas-pts">1 / 1 pts</span>
        </div>
        ${inner}
        <div id="c-explain-${q.id}"></div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:14px;color:var(--text-dim);">Bài thi Canvas tổng hợp: ${pool.length} câu hỏi mới</span>
      <button class="btn" onclick="renderSetup()">Thoát</button>
    </div>
    ${questionsHtml}
    <div class="card" style="text-align:center;">
      <button class="start-btn" id="submit-canvas-btn">Nộp Bài Kiểm Tra (Submit Quiz)</button>
    </div>
  `;

  document.querySelectorAll('.opt[data-qid]').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.dataset.qid;
      const optIdx = parseInt(el.dataset.i);
      document.querySelectorAll(`.opt[data-qid="${qid}"]`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      userAnswers[qid] = { value: optIdx };
    });
  });

  document.getElementById('submit-canvas-btn').addEventListener('click', gradeCanvasExam);
}

function gradeCanvasExam(){
  if(!confirm('Bạn có chắc chắn muốn nộp bài để xem điểm và lời giải chi tiết?')) return;

  let totalScore = 0;
  pool.forEach(q => {
    let isCorrect = false;
    if(q.type === 'short'){
      const inputEl = document.getElementById(`c-ans-${q.id}`);
      const val = (inputEl ? inputEl.value : '').trim();
      isCorrect = (val.toLowerCase() === q.answer.toLowerCase());
      userAnswers[q.id] = { value: val, isCorrect };
      if(inputEl) inputEl.disabled = true;
    } else {
      const saved = userAnswers[q.id];
      const chosen = saved ? saved.value : -1;
      isCorrect = (chosen === q.correctDisplay);
      userAnswers[q.id] = { value: chosen, isCorrect };

      q.displayOpts.forEach((_, i) => {
        const optEl = document.getElementById(`c-opt-${q.id}-${i}`);
        if(optEl){
          optEl.classList.add('disabled');
          if(i === q.correctDisplay) optEl.classList.add('correct');
          else if(i === chosen) optEl.classList.add('wrong');
        }
      });
    }

    if(isCorrect) totalScore++;

    const explainEl = document.getElementById(`c-explain-${q.id}`);
    if(explainEl){
      explainEl.innerHTML = `
        <div class="explain-box ${isCorrect ? 'correct-box' : ''}">
          <b>${isCorrect ? '✓ Đáp án chính xác!' : '✕ Giải thích & Đáp án:'}</b><br>
          ${q.type === 'short' ? `Đáp án đúng: <code>${q.answer}</code><br>` : ''}
          ${q.explain}
        </div>
      `;
    }
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('submit-canvas-btn').style.display = 'none';

  const summaryBanner = document.createElement('div');
  summaryBanner.className = 'card';
  summaryBanner.innerHTML = `
    <div class="score-hero">
      <div class="score-num">${totalScore}<span> / ${pool.length}</span></div>
      <div class="score-sub">Điểm số bài thi của bạn (${Math.round(totalScore/pool.length*100)}%)</div>
    </div>
    <button class="start-btn" onclick="renderSetup()">Làm bài khác</button>
  `;
  app.prepend(summaryBanner);
}

/* ============ FINAL RESULTS VIEW ============ */
function renderResults(){
  let correctCount = 0;
  pool.forEach(q => {
    const a = userAnswers[q.id];
    if(a && a.isCorrect) correctCount++;
  });

  const reviewItems = pool.map(q => {
    const a = userAnswers[q.id];
    const isOk = a && a.isCorrect;
    const mark = isOk ? `<span class="review-mark ok">✓</span>` : `<span class="review-mark bad">✕</span>`;

    let detailStr = '';
    if(q.type === 'short'){
      detailStr = `<b>Bạn trả lời:</b> ${a && a.value ? a.value : '<i>(để trống)</i>'} &nbsp;|&nbsp; <b>Đáp án đúng:</b> <code>${q.answer}</code>`;
    } else {
      const userText = (a && a.value !== undefined && a.value !== -1) ? q.displayOpts[a.value] : '<i>(chưa chọn)</i>';
      detailStr = `<b>Bạn chọn:</b> ${userText} &nbsp;|&nbsp; <b>Đáp án đúng:</b> ${q.displayOpts[q.correctDisplay]}`;
    }

    return `
      <div class="review-item">
        <div class="review-head">${mark}<div class="review-q">${q.q}</div></div>
        <div style="font-size:13px;color:var(--text-dim);margin:6px 0 8px 22px;">${detailStr}</div>
        <div class="explain-box ${isOk ? 'correct-box' : ''}" style="margin-left:22px">
          <b>Giải thích:</b> ${q.explain}
        </div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="card">
      <div class="score-hero">
        <div class="score-num">${correctCount}<span> / ${pool.length}</span></div>
        <div class="score-sub">Số câu trả lời chính xác (${Math.round(correctCount/pool.length*100)}%)</div>
      </div>
    </div>
    <div class="card">
      <div class="setup-title">Xem lại toàn bộ đáp án & Phân tích chi tiết</div>
      ${reviewItems}
    </div>
    <button class="start-btn" id="restart-btn">Làm lại bài thi mới</button>
  `;

  document.getElementById('restart-btn').addEventListener('click', renderSetup);
}

/* ============ KEYBOARD SHORTCUTS ============ */
window.addEventListener('keydown', e => {
  if(mode === 'canvas') return;
  const q = pool[currentIdx];
  if(!q) return;

  const isInputFocused = (document.activeElement && document.activeElement.tagName === 'INPUT');

  if(['1', '2', '3', '4'].includes(e.key) && q.type === 'mcq' && !isInputFocused){
    const optIdx = parseInt(e.key) - 1;
    if(optIdx < q.displayOpts.length){
      if(mode === 'practice' && userAnswers[q.id]) return;
      handleOptionSelect(optIdx);
    }
  } else if((e.key === 'ArrowRight' || e.key === 'Enter') && !isInputFocused){
    const nextBtn = document.getElementById('next-btn');
    if(nextBtn && !nextBtn.disabled) goNextStep();
  } else if(e.key === 'ArrowLeft' && !isInputFocused){
    const prevBtn = document.getElementById('prev-btn');
    if(prevBtn && !prevBtn.disabled) goPrevStep();
  }
});

renderSetup();
</script>
</body>
</html>
